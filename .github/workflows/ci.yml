name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Node comes from .nvmrc so this file, the Dockerfile and a developer's
      # machine cannot drift onto different patch releases. `node-version: 22`
      # resolved to whatever the latest 22.x was at the moment each job ran,
      # which is not the same thing as the version the image was built on.
      #
      # `cache: npm` is deliberately NOT set here. The action would run
      # `npm config get cache` to locate the cache directory, and it runs it
      # with the npm that ships with Node — 10.9.8 — before the upgrade below
      # has had a chance to happen. package.json's `devEngines` refuses that
      # npm with EBADDEVENGINES, so the action itself fails. The cache is
      # restored a step later instead, once the right npm is in place.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Node 22 LTS bundles npm 10.9.8, which rejects a lockfile written by
      # npm 11. Rather than constrain the development machine to a version with
      # a known unfixed install crash (npm/cli#9787), one npm runs everywhere —
      # see the note in the Dockerfile and `devEngines` in package.json.
      # A global install is not gated by devEngines, which is what makes this
      # step able to run at all.
      - run: npm i -g npm@11.6.2

      # What `cache: npm` above would have done, but after the upgrade. Keyed on
      # the lockfile, so a dependency change invalidates it and nothing else
      # does.
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - run: npm ci

      # Compose is used rather than GitHub's `services:` block so CI exercises
      # the SAME database wiring as a developer's machine — including the
      # app_user / migrator role separation created by db/init, which is the
      # thing that makes row-level security actually bind.
      #
      # A `services: postgres` block would run everything as the superuser, and
      # every isolation test would pass vacuously while proving nothing.
      - name: Prepare environment
        run: |
          cp .env.example .env
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          POSTGRES_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          sed -i "s|replace-me-with-32-bytes-of-base64-randomness|${SECRET}|" .env
          sed -i "s|^POSTGRES_SUPERUSER_PASSWORD=$|POSTGRES_SUPERUSER_PASSWORD=${POSTGRES_SECRET}|" .env
          sed -i "s|replace-with-your-generated-superuser-password|${POSTGRES_SECRET}|g" .env

      - name: Start PostgreSQL and Redis
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 40); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' cms_postgres)" = "healthy" ]; then
              echo "postgres healthy"; exit 0
            fi
            sleep 2
          done
          echo "postgres never became healthy"; docker logs cms_postgres || true; exit 1

      # Each run also re-asserts against pg_catalog that app_user is powerless,
      # owns nothing, that every org_id table has FORCEd RLS, and that the audit
      # log has no UPDATE or DELETE policy. The migration FAILS if any drifted.
      - name: Migrate (applies + verifies RLS)
        run: |
          npm run db:migrate
          npm run db:migrate:test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Static guard against the shapes of tenancy bypass. Cheap, and it makes
      # the failure arrive in review rather than as an empty result at runtime.
      - name: Tenancy guard
        run: npm run guard

      # Includes the cross-tenant isolation suite. This step must never be made
      # optional — it gates the one unrecoverable failure mode.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The e2e suite runs against the PRODUCTION build and needs data, so the
      # database is seeded first. This is the layer the integration tests
      # structurally cannot reach: they call services directly, so a page that
      # throws on render or a Server Action never wired to its form passes every
      # one of them and fails the first human.
      - name: Seed for end-to-end tests
        run: npm run db:seed:reset

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # `docker logs`, not `docker compose logs`: Compose interpolates the
      # compose file first, and POSTGRES_SUPERUSER_PASSWORD is required there.
      # When the job fails before "Prepare environment" has written .env, the
      # Compose form fails too and adds a second, misleading error to the run.
      - name: Database logs on failure
        if: failure()
        run: docker logs cms_postgres || echo "cms_postgres was never started"
