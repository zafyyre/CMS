name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Compose is used rather than GitHub's `services:` block so CI exercises
      # the SAME database wiring as a developer's machine — including the
      # app_user / migrator role separation created by db/init, which is the
      # thing that makes row-level security actually bind.
      #
      # A `services: postgres` block would run everything as the superuser, and
      # every isolation test would pass vacuously while proving nothing.
      - name: Prepare environment
        run: |
          cp .env.example .env
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          POSTGRES_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          sed -i "s|replace-me-with-32-bytes-of-base64-randomness|${SECRET}|" .env
          sed -i "s|^POSTGRES_SUPERUSER_PASSWORD=$|POSTGRES_SUPERUSER_PASSWORD=${POSTGRES_SECRET}|" .env
          sed -i "s|replace-with-your-generated-superuser-password|${POSTGRES_SECRET}|g" .env

      - name: Start PostgreSQL and Redis
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 40); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' cms_postgres)" = "healthy" ]; then
              echo "postgres healthy"; exit 0
            fi
            sleep 2
          done
          echo "postgres never became healthy"; docker compose logs postgres; exit 1

      # Each run also re-asserts against pg_catalog that app_user is powerless,
      # owns nothing, that every org_id table has FORCEd RLS, and that the audit
      # log has no UPDATE or DELETE policy. The migration FAILS if any drifted.
      - name: Migrate (applies + verifies RLS)
        run: |
          npm run db:migrate
          npm run db:migrate:test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Static guard against the shapes of tenancy bypass. Cheap, and it makes
      # the failure arrive in review rather than as an empty result at runtime.
      - name: Tenancy guard
        run: npm run guard

      # Includes the cross-tenant isolation suite. This step must never be made
      # optional — it gates the one unrecoverable failure mode.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The e2e suite runs against the PRODUCTION build and needs data, so the
      # database is seeded first. This is the layer the integration tests
      # structurally cannot reach: they call services directly, so a page that
      # throws on render or a Server Action never wired to its form passes every
      # one of them and fails the first human.
      - name: Seed for end-to-end tests
        run: npm run db:seed:reset

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Database logs on failure
        if: failure()
        run: docker compose logs postgres
