services:
  postgres:
    image: postgres:17
    container_name: cms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Deliberately required rather than defaulted: copying .env.example without
      # generating a local secret must fail before a database is exposed.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: cms
    ports:
      # Host port 5433, NOT 5432.
      #
      # This machine runs a native PostgreSQL 18 Windows service already bound
      # to 0.0.0.0:5432. Docker's mapping does not displace it, so an app
      # pointed at localhost:5432 silently reaches the wrong server — verified
      # by connecting with this container's own password and being rejected.
      #
      # Using a distinct port leaves that existing install untouched.
      # Development services must not be reachable from the LAN.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty data volume.
      # `docker compose down -v` wipes the volume so these re-run.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Over TCP (`-h 127.0.0.1`), not the default Unix socket. On a fresh volume
    # the image first runs a temporary SOCKET-ONLY server to execute db/init,
    # then shuts it down and starts the real one. Probing the socket reported
    # "ready" during that temporary server — measured at 0.87s, before db/init
    # had even created app_user — while TCP, which is what the app and CI
    # actually use, only came up at 1.72s. Probing TCP can only succeed once the
    # real server is listening, and therefore once db/init has finished.
    #
    # start_period + start_interval: probe every second while starting, and
    # don't count early failures against `retries`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d cms']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  redis:
    image: redis:7
    container_name: cms_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Redis has no authentication configured for this development stack, so
      # keep it private to this host just like PostgreSQL.
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
